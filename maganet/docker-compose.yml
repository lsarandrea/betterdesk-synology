# BetterDesk — MaGaServer1
# Dominio: betterdesk.maganet.it
# Console: https://betterdesk.maganet.it (via reverse proxy Synology → porta 5000)
# Install page: https://install.maganet.it
#
# PRIMA DI AVVIARE:
#   mkdir -p /volume1/docker/betterdesk/{server,console}
#   chown -R root:root /volume1/docker/betterdesk
#   chmod -R 755 /volume1/docker/betterdesk

services:
  server:
    image: ghcr.io/unitronix/betterdesk-server:latest
    container_name: betterdesk-server
    hostname: betterdesk-server
    ports:
      - "21114:21114"
      - "21115:21115"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21117:21117"
      - "21118:21118"
      - "21119:21119"
    command:
      - "/usr/local/bin/betterdesk-server"
      - "-mode"
      - "all"
      - "-key-file"
      - "/opt/rustdesk/id_ed25519"
    volumes:
      - /volume1/docker/betterdesk/server:/opt/rustdesk
    environment:
      - ENCRYPTED_ONLY=1
      - DB_URL=/opt/rustdesk/db_v2.sqlite3
      # IP pubblico reale di MaGaServer1 (rilevato automaticamente al primo avvio)
      - PUBLIC_IP=217.198.140.12
      - RELAY_SERVERS=betterdesk.maganet.it:21117
    networks:
      - betterdesk-net
    restart: unless-stopped

  console:
    image: ghcr.io/unitronix/betterdesk-console:latest
    container_name: betterdesk-console
    # NOTA: hostname rimosso — incompatibile con network_mode: service:
    ports:
      - "5000:5000"
      - "21121:21121"
    network_mode: service:server
    volumes:
      - /volume1/docker/betterdesk/server:/opt/rustdesk
      - /volume1/docker/betterdesk/console:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - API_HOST=0.0.0.0
      - SERVER_BACKEND=betterdesk-server
      - HBBS_API_URL=http://127.0.0.1:21114/api
      - BETTERDESK_API_URL=http://127.0.0.1:21114/api
      - RUSTDESK_PATH=/opt/rustdesk
      - DATA_DIR=/app/data
      - DB_PATH=/opt/rustdesk/db_v2.sqlite3
      - PUB_KEY_PATH=/opt/rustdesk/id_ed25519.pub
      - API_KEY_PATH=/opt/rustdesk/.api_key
      - WS_HBBS_HOST=localhost
      - WS_HBBS_PORT=21116
      - WS_HBBR_HOST=localhost
      - WS_HBBR_PORT=21117
      - HBBS_WS_URL=ws://localhost:21118
      - HBBR_WS_URL=ws://localhost:21119
      - CDAP_URL=ws://localhost:21122/cdap
      - DOCKER=true
      - INIT_ADMIN_USER=admin
      # Se il DB esiste già, questa variabile viene ignorata.
      # Usare: docker logs betterdesk-console | grep -i "admin password"
      - INIT_ADMIN_PASS=CHANGE_ME_PASSWORD
      # FIX: forza Node.js a usare IPv4 → risolve ECONNREFUSED su 127.0.0.1:21114
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - server
    restart: unless-stopped

networks:
  betterdesk-net:
    driver: bridge
