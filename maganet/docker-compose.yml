# BetterDesk — MaGaServer1
# Dominio: betterdesk.maganet.it
# Console: https://betterdesk.maganet.it (via reverse proxy Synology → porta 5000)
# Install page: https://install.maganet.it
#
# PRIMA DI AVVIARE:
#   mkdir -p /volume1/docker/betterdesk/server /volume1/docker/betterdesk/console/appdata
#   chown -R root:root /volume1/docker/betterdesk/server
#   chmod -R 755 /volume1/docker/betterdesk/server
#   chmod -R 777 /volume1/docker/betterdesk/console/appdata
#   chmod 644 /volume1/docker/betterdesk/docker-compose.yml
#   NOTA: curl scarica il file con permessi 555 (sola lettura). Il chmod 644 è necessario
#         per permettere future modifiche al file senza usare sudo/root forzato.
#
# PRIMO AVVIO — credenziali admin:
#   BetterDesk genera automaticamente la password admin e la scrive in:
#     /volume1/docker/betterdesk/server/.admin_credentials
#   Procedura:
#     1. cat /volume1/docker/betterdesk/server/.admin_credentials  → leggi username e password
#     2. Accedi alla console web con quelle credenziali
#     3. Cambia la password dalla GUI (Impostazioni profilo)
#     4. rm /volume1/docker/betterdesk/server/.admin_credentials  → elimina il file
#   NOTA: INIT_ADMIN_PASS è stato rimosso perché BetterDesk ignora o processa
#         in modo imprevedibile le password con caratteri speciali ($, !, ecc.).
#         La password generata automaticamente è sempre quella corretta da usare.

services:
  server:
    image: ghcr.io/unitronix/betterdesk-server:latest
    container_name: betterdesk-server
    hostname: betterdesk-server
    network_mode: host
    command:
      - "/usr/local/bin/betterdesk-server"
      - "-mode"
      - "all"
      - "-key-file"
      - "/opt/rustdesk/id_ed25519"
    volumes:
      - /volume1/docker/betterdesk/server:/opt/rustdesk
    environment:
      - ENCRYPTED_ONLY=1
      - DB_URL=/opt/rustdesk/db_v2.sqlite3
      - RELAY_SERVERS=betterdesk.maganet.it:21117
      - PUBLIC_IP=217.198.140.12
    healthcheck:
      # FIX: con network_mode:host il pallino Portainer/CM è arancione senza healthcheck esplicito.
      # Questo healthcheck forza il controllo via localhost e rende il container verde.
      test: ["CMD", "curl", "-sf", "http://localhost:21114/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  console:
    image: ghcr.io/unitronix/betterdesk-console:latest
    container_name: betterdesk-console
    hostname: betterdesk-console
    network_mode: host
    volumes:
      - /volume1/docker/betterdesk/server:/opt/rustdesk
      # NOTA: cartella appdata separata (non app/data) — deve esistere con chmod 777
      - /volume1/docker/betterdesk/console/appdata:/appdata
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - API_HOST=0.0.0.0
      - SERVER_BACKEND=localhost
      - HBBS_API_URL=http://localhost:21114/api
      - BETTERDESK_API_URL=http://localhost:21114/api
      - RUSTDESK_PATH=/opt/rustdesk
      - DATA_DIR=/appdata
      - DB_PATH=/opt/rustdesk/db_v2.sqlite3
      - PUB_KEY_PATH=/opt/rustdesk/id_ed25519.pub
      - API_KEY_PATH=/opt/rustdesk/.api_key
      - WS_HBBS_HOST=localhost
      - WS_HBBS_PORT=21116
      - WS_HBBR_HOST=localhost
      - WS_HBBR_PORT=21117
      - HBBS_WS_URL=ws://localhost:21118
      - HBBR_WS_URL=ws://localhost:21119
      - CDAP_URL=ws://localhost:21122/cdap
      - DOCKER=true
      - INIT_ADMIN_USER=admin
      # FIX: forza Node.js a usare IPv4 → risolve ECONNREFUSED su localhost:21114
      - NODE_OPTIONS=--dns-result-order=ipv4first
    restart: unless-stopped
